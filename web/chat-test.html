<!doctype html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RemindRx Chat Test</title>
<style>body{margin:0;background:#f5f6fa;font:15px system-ui;color:#202435}.app{max-width:900px;height:100vh;margin:auto;display:grid;grid-template-rows:auto 1fr auto;background:white}header{padding:18px 22px;border-bottom:1px solid #e6e8ef}header h1{margin:0;font-size:20px}header p{margin:5px 0 0;color:#687086}.messages{padding:20px;overflow:auto}.msg{max-width:75%;margin:10px 0;padding:12px 14px;border-radius:14px;white-space:pre-wrap}.user{margin-left:auto;color:white;background:#7056ce}.assistant{background:#f0f2f6}.error{color:#a61b1b;background:#fff0f0}form{display:flex;gap:10px;padding:16px;border-top:1px solid #e6e8ef}textarea{flex:1;min-height:48px;padding:12px;border:1px solid #ccd1dc;border-radius:10px;font:inherit}button{padding:0 20px;border:0;border-radius:10px;color:white;background:#7056ce;font-weight:700}</style></head>
<body><div class="app"><header><h1>RemindRx Chat Test</h1><p>Chế độ phát triển local · không dùng đăng nhập · không bật trên production</p></header><main class="messages" id="messages"><div class="msg assistant">Nhập câu hỏi để kiểm thử toàn bộ graph chatbot.</div></main><form id="form"><textarea id="input" placeholder="Ví dụ: Tôi bị buồn nôn sau khi uống thuốc"></textarea><button>Gửi</button></form></div>
<script>let conversationId=crypto.randomUUID();const messages=document.querySelector('#messages'),input=document.querySelector('#input'),form=document.querySelector('#form');function add(role,text,err=false){const el=document.createElement('div');el.className=`msg ${role} ${err?'error':''}`;el.textContent=text;messages.append(el);messages.scrollTop=messages.scrollHeight}form.onsubmit=async e=>{e.preventDefault();const message=input.value.trim();if(!message)return;add('user',message);input.value='';const button=form.querySelector('button');button.disabled=true;try{const now=new Date();const r=await fetch('/api/v1/dev/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message,conversationId,clientDate:now.toISOString().slice(0,10),clientDateTime:now.toISOString()})});const body=await r.json();if(!r.ok)throw new Error(body.detail||body.message||`HTTP ${r.status}`);const data=body.data;conversationId=data.conversationId||conversationId;add('assistant',data.response)}catch(err){add('assistant',err.message,true)}finally{button.disabled=false;input.focus()}};input.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();form.requestSubmit()}};</script></body></html>
