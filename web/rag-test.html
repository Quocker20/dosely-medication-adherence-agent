<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Dược thư RAG Test</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#0d1b2d;--line:#213956;--text:#e7f0fa;--muted:#8eabc8;--accent:#50d6c8;--blue:#77b7f2;--danger:#ff8383}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,sans-serif}.app{display:grid;grid-template-columns:270px 1fr;height:100vh}
    aside{border-right:1px solid var(--line);padding:18px;overflow:auto}main{display:flex;flex-direction:column;min-width:0}.brand{font-size:20px;font-weight:800;margin-bottom:16px}.muted{color:var(--muted)}
    button,select,textarea{font:inherit}button{border:1px solid var(--line);background:#122841;color:var(--text);padding:9px 12px;border-radius:9px;cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);color:#05201e;border:0;font-weight:700}button:disabled{opacity:.5;cursor:not-allowed}
    .new{width:100%;margin-bottom:14px}.history{display:grid;gap:8px}.history-item{display:flex;gap:6px}.history-item button:first-child{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.delete{color:var(--danger)}
    header{padding:22px 28px;border-bottom:1px solid var(--line)}h1{font-size:24px;margin:0}.chat{flex:1;overflow:auto;padding:24px max(24px,calc((100% - 900px)/2));display:grid;align-content:start;gap:16px}.empty{text-align:center;margin-top:15vh}.message{padding:16px 18px;border:1px solid var(--line);border-radius:14px;max-width:88%;white-space:pre-wrap}.user{justify-self:end;background:#12314d}.assistant{justify-self:start;background:var(--panel)}.meta{font-size:12px;color:var(--blue);margin-bottom:7px;text-transform:uppercase}.error{color:var(--danger)}
    details{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.source{background:#091524;border:1px solid var(--line);padding:10px;margin-top:8px;border-radius:8px}.source b{color:var(--accent)}
    .trace{font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted);white-space:normal}.trace-grid{display:grid;grid-template-columns:max-content 1fr;gap:3px 12px;margin-top:8px}.trace-source{overflow-wrap:anywhere;color:var(--blue)}
    form{border-top:1px solid var(--line);padding:16px max(24px,calc((100% - 900px)/2)) 22px}.composer{display:flex;gap:10px;align-items:flex-end}textarea{flex:1;resize:vertical;min-height:54px;max-height:180px;background:#091524;color:var(--text);border:1px solid var(--line);border-radius:12px;padding:13px}.controls{display:flex;gap:12px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}select{background:#091524;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:4px}.counter{margin-left:auto}
    @media(max-width:700px){.app{grid-template-columns:1fr}aside{display:none}.message{max-width:96%}header,.chat,form{padding-left:14px;padding-right:14px}}
  </style>
</head>
<body>
<div class="app">
  <aside><div class="brand">Dược thư RAG</div><button class="new primary" id="newChat">+ Cuộc trò chuyện mới</button><div class="muted" style="margin-bottom:8px">Lịch sử</div><div class="history" id="history"></div></aside>
  <main>
    <header><h1>RAG Test Lab</h1><div class="muted">Kiểm tra retrieval, nguồn, input guardrail và grounding validator.</div></header>
    <section class="chat" id="chat"><div class="empty"><h2>Hỏi thông tin thuốc</h2><p class="muted">Ví dụ: Paracetamol có chống chỉ định gì?</p></div></section>
    <form id="form">
      <div class="composer"><textarea id="question" required minlength="2" maxlength="1000" placeholder="Nhập câu hỏi... (Enter để gửi, Shift+Enter xuống dòng)"></textarea><button class="primary" id="send">Gửi</button></div>
      <div class="controls"><label>Top-k <select id="topK"><option>1</option><option selected>3</option><option>5</option><option>8</option></select></label><span class="counter" id="counter">0/20 lượt</span></div>
    </form>
  </main>
</div>
<script>
  const $=s=>document.querySelector(s), chat=$('#chat'), history=$('#history'), question=$('#question'), send=$('#send'), counter=$('#counter');
  let conversationId=null;
  const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  async function api(url,options={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...options});if(!r.ok){let m=`HTTP ${r.status}`;try{m=(await r.json()).detail||m}catch{}throw new Error(m)}return r.status===204?null:r.json()}
  function renderMessage(role,text,status='',sources=[],trace=null){chat.querySelector('.empty')?.remove();const box=document.createElement('article');box.className=`message ${role}`;let html=`<div class="meta">${role==='user'?'Bạn':`Trợ lý · ${esc(status)}`}</div><div>${esc(text)}</div>`;if(sources.length){html+=`<details><summary>${sources.length} nguồn truy xuất</summary>${sources.map(s=>`<div class="source"><b>[Nguồn ${s.number}] ${esc(s.drug_name)}</b><div>${esc(s.section)} · trang ${esc(s.page_start)}–${esc(s.page_end)}</div><div class="muted">${esc(s.excerpt)}</div></div>`).join('')}</details>`}if(trace){html+=`<details class="trace" open><summary>Log test #${esc(trace.test_id)} · ${esc(trace.elapsed_ms)} ms</summary><div class="trace-grid"><span>Status</span><span>${esc(trace.status)}</span><span>Top-k</span><span>${esc(trace.top_k)}</span><span>Grounding</span><span>${esc(trace.grounding_valid)}</span><span>Safety</span><span>${esc(trace.safety_reason||'none')}</span><span>Retrieved</span><span>${esc(trace.retrieved_count)}</span></div>${(trace.grounding_errors||[]).map(x=>`<div class="error">grounding: ${esc(x)}</div>`).join('')}${(trace.sources||[]).map(s=>`<div class="trace-source">[${esc(s.number)}] ${esc(s.chunk_id)} · score=${esc(s.score)} · ${esc(s.drug_name)}/${esc(s.section)} · pages ${esc(s.pages)}</div>`).join('')}</details>`}box.innerHTML=html;chat.append(box);chat.scrollTop=chat.scrollHeight}
  async function refreshHistory(){const items=await api('/api/conversations');history.innerHTML=items.map(c=>`<div class="history-item"><button data-open="${c.id}" title="${esc(c.title)}">${esc(c.title)}</button><button class="delete" data-delete="${c.id}">×</button></div>`).join('')||'<div class="muted">Chưa có lịch sử</div>'}
  async function openConversation(id){const c=await api(`/api/conversations/${id}`);conversationId=id;chat.innerHTML='';c.messages.forEach(m=>renderMessage(m.role,m.content,m.status));if(!c.messages.length)chat.innerHTML='<div class="empty"><h2>Cuộc trò chuyện mới</h2></div>';counter.textContent=`${c.exchange_count}/${c.max_exchanges} lượt`;question.focus()}
  async function newConversation(){const c=await api('/api/conversations',{method:'POST'});await refreshHistory();await openConversation(c.id)}
  history.addEventListener('click',async e=>{const open=e.target.dataset.open,del=e.target.dataset.delete;if(open)await openConversation(open);if(del&&confirm('Xóa cuộc trò chuyện này?')){await api(`/api/conversations/${del}`,{method:'DELETE'});if(del===conversationId)conversationId=null;await refreshHistory()}});
  $('#newChat').onclick=newConversation;
  question.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('#form').requestSubmit()}});
  $('#form').addEventListener('submit',async e=>{e.preventDefault();const q=question.value.trim();if(!q)return;send.disabled=true;question.disabled=true;renderMessage('user',q);question.value='';try{const data=await api('/api/query',{method:'POST',body:JSON.stringify({question:q,top_k:Number($('#topK').value),conversation_id:conversationId})});conversationId=data.conversation_id;renderMessage('assistant',data.answer,data.status,data.sources,data.trace);counter.textContent=`${data.exchange_count}/${data.max_exchanges} lượt`;await refreshHistory()}catch(err){renderMessage('assistant',err.message,'error');}finally{send.disabled=false;question.disabled=false;question.focus()}});
  (async()=>{try{await refreshHistory();const items=await api('/api/conversations');items.length?await openConversation(items[0].id):await newConversation()}catch(e){chat.innerHTML=`<div class="error">Không kết nối được backend: ${esc(e.message)}</div>`}})();
</script>
</body>
</html>
