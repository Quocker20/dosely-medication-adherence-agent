<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Chạy thật app Android RemindRx trong trình duyệt qua Appetize.io để test thử." />
    <title>RemindRx — Thử app Android trên web</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f172a;
        --panel: #1e293b;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --accent: #38bdf8;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 32px 16px 64px;
      }
      header { text-align: center; max-width: 640px; margin-bottom: 24px; }
      header h1 { font-size: 1.5rem; margin: 0 0 8px; }
      header p { color: var(--muted); margin: 0; font-size: 0.95rem; }
      .stage {
        background: var(--panel);
        border-radius: 16px;
        padding: 24px;
        display: flex;
        justify-content: center;
        min-width: 320px;
      }
      iframe {
        border: none;
        border-radius: 12px;
        width: 378px;
        height: 800px;
      }
      .empty-state {
        max-width: 480px;
        text-align: left;
        line-height: 1.6;
        font-size: 0.95rem;
      }
      .empty-state code {
        background: rgba(148, 163, 184, 0.15);
        padding: 2px 6px;
        border-radius: 4px;
      }
      .empty-state a { color: var(--accent); }
      footer { margin-top: 24px; color: var(--muted); font-size: 0.85rem; text-align: center; }
    </style>
  </head>
  <body>
    <header>
      <h1>RemindRx — Thử app Android trên web</h1>
      <p>App Android thật chạy trong emulator cloud (Appetize.io), stream trực tiếp vào trang này.</p>
    </header>
    <div class="stage" id="stage">
      <p class="empty-state">Đang tải cấu hình…</p>
    </div>
    <footer id="footer"></footer>

    <script src="./config.js" defer></script>
    <script defer>
      window.addEventListener("DOMContentLoaded", () => {
        setTimeout(render, 0);
      });

      function render() {
        const stage = document.getElementById("stage");
        const footer = document.getElementById("footer");
        const cfg = window.APPETIZE_CONFIG;

        if (!cfg || !cfg.publicKey) {
          stage.innerHTML = `
            <div class="empty-state">
              <p><strong>Chưa cấu hình app để test.</strong></p>
              <p>Chưa có <code>publicKey</code> Appetize.io. Làm theo hướng dẫn ở
              <a href="../../docs/android-web-emulator-testing.md">docs/android-web-emulator-testing.md</a>
              để build APK, upload lên Appetize.io, rồi tạo file
              <code>web/public/emulator/config.js</code> từ
              <code>config.example.js</code> với <code>publicKey</code> thật.</p>
            </div>`;
          return;
        }

        const params = new URLSearchParams({
          device: cfg.device || "pixel7",
          osVersion: cfg.osVersion || "13.0",
          scale: cfg.scale || "75",
          orientation: cfg.orientation || "portrait",
          autoplay: cfg.autoplay ? "true" : "false",
        });

        const iframe = document.createElement("iframe");
        iframe.src = `https://appetize.io/embed/${encodeURIComponent(cfg.publicKey)}?${params.toString()}`;
        iframe.allow = "camera; microphone";
        stage.innerHTML = "";
        stage.appendChild(iframe);
        footer.textContent = "Dữ liệu trong bản build này chỉ là dữ liệu demo/mock — không nhập thông tin bệnh nhân thật.";
      }
    </script>
  </body>
</html>
