name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  chatbot-quality-gate:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint chatbot changes
        run: >-
          ruff check --select E4,E7,E9,F,I
          src/agents
          src/modules/agents
          tests/test_agents
          tests/test_eval
          tests/test_api/test_chat_auth.py

      - name: Run chatbot and golden-set tests
        run: >-
          pytest
          tests/test_agents
          tests/test_eval
          tests/test_api/test_chat_auth.py
          -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          RATE_LIMIT_ENABLED: "false"

      - name: Run deterministic chatbot metrics
        run: python eval/hybrid_chat_eval.py --skip-live-rag
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          RATE_LIMIT_ENABLED: "false"
          LANGSMITH_TRACING: "false"

  repository-diagnostics:
    runs-on: self-hosted
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Report legacy lint debt
        run: ruff check src/ tests/

      - name: Run full repository tests
        run: pytest tests/ -v --tb=short
        env:
          APP_ENV: test
          OPENAI_API_KEY: test-key
          RATE_LIMIT_ENABLED: "false"
