[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dosely"
version = "0.1.0"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "langgraph",
    "numpy>=1.26.0",
    "openai>=1.0.0",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "httpx",
    "pytest-timeout",
    "python-dotenv",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
# A hung DB/Redis connection must fail the test, not stall the whole run.
timeout = 120
addopts = "-ra"
markers = [
    "integration: needs the docker-compose.test.yml Postgres/Redis (the default for tests/test_api)",
]
