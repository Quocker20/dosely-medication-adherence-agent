[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dosely"
version = "0.1.0"
description = "Dosely medication adherence backend (FastAPI + Celery + LangGraph)"
requires-python = ">=3.11"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
    "pydantic-settings",
    "python-dotenv",
    "tzdata",
    "python-multipart",
    "bcrypt",
    "pyjwt",
    "fpdf2",
    "celery",
    "redis",
    "langchain",
    "langchain-openai",
    "langgraph",
    "sqlalchemy[asyncio]",
    "alembic",
    "Mako",
    "psycopg2-binary",
    "asyncpg",
    "chromadb",
    "tiktoken",
    "numpy",
    "openai",
    "langdetect",
    "firebase-admin",
    "httpx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "ruff",
    "pypdf",
    "mypy",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
# A hung DB/Redis connection must fail the test, not stall the whole run.
timeout = 120
addopts = "-ra"
markers = [
    "integration: needs the docker-compose.test.yml Postgres/Redis (the default for tests/test_api)",
]
